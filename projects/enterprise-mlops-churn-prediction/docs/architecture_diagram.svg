<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
  <defs>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #112240; }
      .label { font: 700 18px Arial, sans-serif; fill: #112240; }
      .sub { font: 14px Arial, sans-serif; fill: #425466; }
      .box { stroke: #176B87; stroke-width: 3; rx: 18; }
      .arrow { stroke: #176B87; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .feedback { stroke: #E07A5F; stroke-width: 4; fill: none; stroke-dasharray: 10 8; marker-end: url(#arrow2); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#176B87"/></marker>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#E07A5F"/></marker>
  </defs>
  <rect width="1400" height="620" fill="#F7FAFC"/>
  <text x="700" y="48" text-anchor="middle" class="title">Telco Churn - Mini Production ML Architecture</text>

  <rect x="40" y="115" width="190" height="100" fill="#DCEEF8" class="box"/>
  <text x="135" y="153" text-anchor="middle" class="label">CRM CSV</text>
  <text x="135" y="181" text-anchor="middle" class="sub">Daily batch input</text>

  <rect x="285" y="115" width="220" height="100" fill="#E8F4EA" class="box"/>
  <text x="395" y="148" text-anchor="middle" class="label">Ingestion + Quality</text>
  <text x="395" y="178" text-anchor="middle" class="sub">Schema, nulls, ranges</text>
  <text x="395" y="198" text-anchor="middle" class="sub">merge + deduplicate + log</text>

  <rect x="560" y="115" width="210" height="100" fill="#FFF1D6" class="box"/>
  <text x="665" y="148" text-anchor="middle" class="label">Shared Features</text>
  <text x="665" y="178" text-anchor="middle" class="sub">6 engineered features</text>
  <text x="665" y="198" text-anchor="middle" class="sub">train-only fitted threshold</text>

  <rect x="825" y="115" width="225" height="100" fill="#EDE7F6" class="box"/>
  <text x="937" y="148" text-anchor="middle" class="label">Training + Evaluation</text>
  <text x="937" y="178" text-anchor="middle" class="sub">LR baseline vs TensorFlow NN</text>
  <text x="937" y="198" text-anchor="middle" class="sub">validation guardrails</text>

  <rect x="1105" y="115" width="250" height="100" fill="#FCE8E6" class="box"/>
  <text x="1230" y="148" text-anchor="middle" class="label">Champion Artifacts</text>
  <text x="1230" y="178" text-anchor="middle" class="sub">model + preprocessor</text>
  <text x="1230" y="198" text-anchor="middle" class="sub">threshold + manifest</text>

  <path d="M230 165 H285" class="arrow"/><path d="M505 165 H560" class="arrow"/><path d="M770 165 H825" class="arrow"/><path d="M1050 165 H1105" class="arrow"/>

  <rect x="760" y="320" width="230" height="100" fill="#DCEEF8" class="box"/>
  <text x="875" y="354" text-anchor="middle" class="label">FastAPI Online</text>
  <text x="875" y="384" text-anchor="middle" class="sub">/predict, /health, /metrics</text>

  <rect x="1045" y="320" width="230" height="100" fill="#E8F4EA" class="box"/>
  <text x="1160" y="354" text-anchor="middle" class="label">Batch Scoring</text>
  <text x="1160" y="384" text-anchor="middle" class="sub">CSV predictions + risk bands</text>

  <rect x="350" y="320" width="300" height="100" fill="#FFF1D6" class="box"/>
  <text x="500" y="354" text-anchor="middle" class="label">Monitoring + Feedback</text>
  <text x="500" y="384" text-anchor="middle" class="sub">latency, errors, quality, PSI/KS</text>

  <rect x="70" y="320" width="220" height="100" fill="#FCE8E6" class="box"/>
  <text x="180" y="354" text-anchor="middle" class="label">Retraining Trigger</text>
  <text x="180" y="384" text-anchor="middle" class="sub">data, AUC, drift, time</text>

  <path d="M1230 215 V270 H875 V320" class="arrow"/>
  <path d="M1230 215 V320" class="arrow"/>
  <path d="M760 370 H650" class="arrow"/>
  <path d="M1045 370 H990" class="arrow"/>
  <path d="M350 370 H290" class="arrow"/>
  <path d="M180 320 V270 H937 V215" class="feedback"/>

  <text x="700" y="520" text-anchor="middle" class="label">Training-serving consistency</text>
  <text x="700" y="550" text-anchor="middle" class="sub">The same fitted threshold, encoders, scaler, feature order, and champion manifest are used in online and batch inference.</text>
</svg>
