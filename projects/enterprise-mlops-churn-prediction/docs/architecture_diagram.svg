<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="660" viewBox="0 0 1920 660" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise Telco Churn Machine Learning Lifecycle</title>
  <desc id="desc">Data Sources flow through Pipelines, Features, Training, an optional Model Registry, Serving, Monitoring, and Retraining, with a governed feedback loop.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#F7FAFC"/>
      <stop offset="1" stop-color="#EEF4FA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#102A43" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#176B87"/>
    </marker>
    <marker id="feedback-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#D65A4A"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #102A43; }
      .subtitle { font: 16px Arial, Helvetica, sans-serif; fill: #486581; }
      .step { font: 700 13px Arial, Helvetica, sans-serif; fill: #FFFFFF; letter-spacing: 1px; }
      .label { font: 700 19px Arial, Helvetica, sans-serif; fill: #102A43; }
      .small-label { font: 700 17px Arial, Helvetica, sans-serif; fill: #102A43; }
      .detail { font: 14px Arial, Helvetica, sans-serif; fill: #334E68; }
      .status { font: 700 13px Arial, Helvetica, sans-serif; fill: #176B87; }
      .arrow { stroke: #176B87; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .feedback { stroke: #D65A4A; stroke-width: 4; fill: none; stroke-dasharray: 12 9; marker-end: url(#feedback-arrow); }
    </style>
  </defs>

  <rect width="1920" height="660" fill="url(#background)"/>
  <text x="960" y="58" text-anchor="middle" class="title">Enterprise Telco Churn — Governed ML Lifecycle</text>
  <text x="960" y="88" text-anchor="middle" class="subtitle">One reproducible path from source data to monitored predictions and evidence-based retraining</text>

  <!-- Connecting arrows -->
  <path d="M250 270 H278" class="arrow"/>
  <path d="M480 270 H508" class="arrow"/>
  <path d="M710 270 H738" class="arrow"/>
  <path d="M940 270 H968" class="arrow"/>
  <path d="M1170 270 H1198" class="arrow"/>
  <path d="M1400 270 H1428" class="arrow"/>
  <path d="M1630 270 H1658" class="arrow"/>

  <!-- Stage 1 -->
  <g filter="url(#shadow)">
    <rect x="48" y="160" width="202" height="220" rx="18" fill="#DCEEF8" stroke="#176B87" stroke-width="3"/>
    <circle cx="82" cy="194" r="20" fill="#176B87"/>
    <text x="82" y="199" text-anchor="middle" class="step">01</text>
    <text x="149" y="239" text-anchor="middle" class="label">Data Sources</text>
    <text x="149" y="278" text-anchor="middle" class="detail">IBM Telco CSV</text>
    <text x="149" y="302" text-anchor="middle" class="detail">CRM / daily batches</text>
    <text x="149" y="326" text-anchor="middle" class="detail">Delayed churn labels</text>
    <text x="149" y="356" text-anchor="middle" class="status">SHA-256 identified</text>
  </g>

  <!-- Stage 2 -->
  <g filter="url(#shadow)">
    <rect x="278" y="160" width="202" height="220" rx="18" fill="#E5F4EA" stroke="#218739" stroke-width="3"/>
    <circle cx="312" cy="194" r="20" fill="#218739"/>
    <text x="312" y="199" text-anchor="middle" class="step">02</text>
    <text x="379" y="239" text-anchor="middle" class="label">Pipelines</text>
    <text x="379" y="278" text-anchor="middle" class="detail">Ingest + validate</text>
    <text x="379" y="302" text-anchor="middle" class="detail">Merge + deduplicate</text>
    <text x="379" y="326" text-anchor="middle" class="detail">Raw 60 / 20 / 20 split</text>
    <text x="379" y="356" text-anchor="middle" class="status">Audit log retained</text>
  </g>

  <!-- Stage 3 -->
  <g filter="url(#shadow)">
    <rect x="508" y="160" width="202" height="220" rx="18" fill="#FFF2CC" stroke="#B7791F" stroke-width="3"/>
    <circle cx="542" cy="194" r="20" fill="#B7791F"/>
    <text x="542" y="199" text-anchor="middle" class="step">03</text>
    <text x="609" y="239" text-anchor="middle" class="label">Features</text>
    <text x="609" y="278" text-anchor="middle" class="detail">6 engineered features</text>
    <text x="609" y="302" text-anchor="middle" class="detail">Fitted encoders + scaler</text>
    <text x="609" y="326" text-anchor="middle" class="detail">Train-only p75 threshold</text>
    <text x="609" y="356" text-anchor="middle" class="status">Offline = online logic</text>
  </g>

  <!-- Stage 4 -->
  <g filter="url(#shadow)">
    <rect x="738" y="160" width="202" height="220" rx="18" fill="#ECE4F6" stroke="#6B46A1" stroke-width="3"/>
    <circle cx="772" cy="194" r="20" fill="#6B46A1"/>
    <text x="772" y="199" text-anchor="middle" class="step">04</text>
    <text x="839" y="239" text-anchor="middle" class="label">Training</text>
    <text x="839" y="278" text-anchor="middle" class="detail">Balanced Logistic LR</text>
    <text x="839" y="302" text-anchor="middle" class="detail">TensorFlow [64, 32, 16]</text>
    <text x="839" y="326" text-anchor="middle" class="detail">Validation guardrails</text>
    <text x="839" y="356" text-anchor="middle" class="status">MLflow tracked</text>
  </g>

  <!-- Stage 5 -->
  <g filter="url(#shadow)">
    <rect x="968" y="160" width="202" height="220" rx="18" fill="#FCE8E6" stroke="#C44536" stroke-width="3"/>
    <circle cx="1002" cy="194" r="20" fill="#C44536"/>
    <text x="1002" y="199" text-anchor="middle" class="step">05</text>
    <text x="1069" y="232" text-anchor="middle" class="small-label">Model Registry</text>
    <text x="1069" y="254" text-anchor="middle" class="small-label">(Optional)</text>
    <text x="1069" y="291" text-anchor="middle" class="detail">MLflow run metadata</text>
    <text x="1069" y="315" text-anchor="middle" class="detail">Versioned model files</text>
    <text x="1069" y="339" text-anchor="middle" class="detail">Champion manifest</text>
    <text x="1069" y="365" text-anchor="middle" class="status">Baseline v1.0.0</text>
  </g>

  <!-- Stage 6 -->
  <g filter="url(#shadow)">
    <rect x="1198" y="160" width="202" height="220" rx="18" fill="#DCEEF8" stroke="#176B87" stroke-width="3"/>
    <circle cx="1232" cy="194" r="20" fill="#176B87"/>
    <text x="1232" y="199" text-anchor="middle" class="step">06</text>
    <text x="1299" y="239" text-anchor="middle" class="label">Serving</text>
    <text x="1299" y="278" text-anchor="middle" class="detail">FastAPI online REST</text>
    <text x="1299" y="302" text-anchor="middle" class="detail">Chunked batch scoring</text>
    <text x="1299" y="326" text-anchor="middle" class="detail">Docker health checks</text>
    <text x="1299" y="356" text-anchor="middle" class="status">Real artifacts loaded</text>
  </g>

  <!-- Stage 7 -->
  <g filter="url(#shadow)">
    <rect x="1428" y="160" width="202" height="220" rx="18" fill="#E5F4EA" stroke="#218739" stroke-width="3"/>
    <circle cx="1462" cy="194" r="20" fill="#218739"/>
    <text x="1462" y="199" text-anchor="middle" class="step">07</text>
    <text x="1529" y="239" text-anchor="middle" class="label">Monitoring</text>
    <text x="1529" y="278" text-anchor="middle" class="detail">API metrics + alerts</text>
    <text x="1529" y="302" text-anchor="middle" class="detail">Prometheus + Grafana</text>
    <text x="1529" y="326" text-anchor="middle" class="detail">PSI / KS / chi-square</text>
    <text x="1529" y="356" text-anchor="middle" class="status">Stack E2E verified</text>
  </g>

  <!-- Stage 8 -->
  <g filter="url(#shadow)">
    <rect x="1658" y="160" width="202" height="220" rx="18" fill="#FFE9D6" stroke="#D65A4A" stroke-width="3"/>
    <circle cx="1692" cy="194" r="20" fill="#D65A4A"/>
    <text x="1692" y="199" text-anchor="middle" class="step">08</text>
    <text x="1759" y="239" text-anchor="middle" class="label">Retraining</text>
    <text x="1759" y="278" text-anchor="middle" class="detail">New labeled data</text>
    <text x="1759" y="302" text-anchor="middle" class="detail">AUC drop + drift</text>
    <text x="1759" y="326" text-anchor="middle" class="detail">Model age signal</text>
    <text x="1759" y="356" text-anchor="middle" class="status">Decision, not auto-deploy</text>
  </g>

  <!-- Governed feedback loop -->
  <path d="M1759 380 V500 H839 V388" class="feedback"/>
  <rect x="1040" y="474" width="520" height="56" rx="28" fill="#FFFFFF" stroke="#D65A4A" stroke-width="2"/>
  <text x="1300" y="497" text-anchor="middle" class="small-label">Governed feedback loop</text>
  <text x="1300" y="517" text-anchor="middle" class="detail">Human or CI starts training; validation decides promotion or baseline retention</text>

  <text x="960" y="608" text-anchor="middle" class="subtitle">Persisted lineage: source checksum → ingestion log → feature/preprocessing artifacts → trained models → evaluation → champion → serving metrics → retraining decision</text>
</svg>
