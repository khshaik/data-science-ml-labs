# Prometheus configuration
# Bonus Feature: Prometheus + Grafana (+0.5 mark)

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'churn-prediction-monitor'

# Rules are evaluated locally. External Alertmanager notification routing is
# intentionally omitted until a destination and credentials are supplied.

# Scrape configurations
scrape_configs:
  # FastAPI metrics
  - job_name: 'churn-prediction-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

# Alert rules
rule_files:
  - '/etc/prometheus/alerts.yml'
