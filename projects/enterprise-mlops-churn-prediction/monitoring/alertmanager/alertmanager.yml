global:
  resolve_timeout: 5m

route:
  receiver: internal-audit
  group_by: [alertname, severity, job]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: internal-audit
    webhook_configs:
      - url: http://notification-sink:8080/alerts
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity=~"warning|info"
    equal: [alertname, job]
