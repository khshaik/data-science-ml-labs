# Copy this file to alertmanager.local.yml, replace the non-secret deployment
# values, and create the three files named below in ./secrets. The local file and
# every secret are excluded from Git.
global:
  resolve_timeout: 5m
  smtp_smarthost: smtp.example.com:587
  smtp_from: ml-alerts@example.com
  smtp_auth_username: ml-alerts@example.com
  smtp_auth_password_file: /run/secrets/smtp_password
  smtp_require_tls: true

route:
  receiver: internal-audit
  group_by: [alertname, severity, job]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: internal-audit
      matchers:
        - severity=~"info|warning|critical"
      continue: true
    - receiver: external-channels
      matchers:
        - severity=~"warning|critical"

receivers:
  - name: internal-audit
    webhook_configs:
      - url: http://notification-sink:8080/alerts
        send_resolved: true

  - name: external-channels
    webhook_configs:
      - url_file: /run/secrets/external_webhook_url
        send_resolved: true
    slack_configs:
      - api_url_file: /run/secrets/slack_webhook_url
        channel: '#ml-alerts'
        send_resolved: true
        title: '{{ .Status | toUpper }}: {{ .CommonLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ "\\n" }}{{ end }}'
    email_configs:
      - to: ml-on-call@example.com
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity=~"warning|info"
    equal: [alertname, job]
