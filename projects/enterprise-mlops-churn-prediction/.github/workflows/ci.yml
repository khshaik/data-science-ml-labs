# CI/CD Pipeline
# Bonus Feature: CI/CD (+1 mark)

name: ML Model CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Data Quality Checks
  data-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run data quality checks
        run: |
          python src/data/quality.py
      
      - name: Upload quality report
        uses: actions/upload-artifact@v3
        with:
          name: data-quality-report
          path: artifacts/logs/data_quality_report_*.json

  # Job 2: Unit Tests
  unit-tests:
    runs-on: ubuntu-latest
    needs: data-quality
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --cov=src --cov-report=xml
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml

  # Job 3: Model Training
  train-model:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Train baseline model
        run: |
          python src/training/train.py --model baseline
      
      - name: Train candidate model
        run: |
          python src/training/train.py --model candidate
      
      - name: Upload models
        uses: actions/upload-artifact@v3
        with:
          name: trained-models
          path: models/

  # Job 4: Model Evaluation
  evaluate-model:
    runs-on: ubuntu-latest
    needs: train-model
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Download models
        uses: actions/download-artifact@v3
        with:
          name: trained-models
          path: models/
      
      - name: Evaluate models
        run: |
          python src/training/evaluate.py
      
      - name: Check promotion guardrails
        run: |
          # Exit with error if promotion fails
          python -c "
          import json
          with open('artifacts/eval/model_comparison.json', 'r') as f:
              report = json.load(f)
          if not report['promotion_decision']['should_promote']:
              print('❌ Model promotion failed guardrails')
              exit(1)
          print('✅ Model passed promotion guardrails')
          "
      
      - name: Upload evaluation report
        uses: actions/upload-artifact@v3
        with:
          name: evaluation-report
          path: artifacts/eval/

  # Job 5: Integration Tests
  integration-tests:
    runs-on: ubuntu-latest
    needs: evaluate-model
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Download models
        uses: actions/download-artifact@v3
        with:
          name: trained-models
          path: models/
      
      - name: Start API server
        run: |
          uvicorn src.serving.api:app --host 0.0.0.0 --port 8000 &
          sleep 10
      
      - name: Run integration tests
        run: |
          pytest tests/integration/ -v
      
      - name: Test API health
        run: |
          curl -f http://localhost:8000/health || exit 1

  # Job 6: Docker Build
  docker-build:
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Docker image
        run: |
          docker build -f docker/Dockerfile.api -t churn-prediction-api:latest .
      
      - name: Test Docker image
        run: |
          docker run -d -p 8000:8000 --name test-api churn-prediction-api:latest
          sleep 15
          curl -f http://localhost:8000/health || exit 1
          docker stop test-api

  # Job 7: Deploy (only on main branch)
  deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      
      - name: Deploy notification
        run: |
          echo "🚀 Deploying to production..."
          echo "Model version: $(cat models/current_best.json | jq -r '.model_version')"
