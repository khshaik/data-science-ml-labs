# Docker Compose for multi-service deployment
# Bonus Feature: Docker (+1 mark)

services:
  # FastAPI service
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: churn-prediction-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ../models:/app/models
      - ../artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mlops-network

  # MLflow server
  mlflow:
    image: python:3.9-slim
    container_name: mlflow-server
    ports:
      - "5000:5000"
    command: >
      sh -c "pip install mlflow && 
             mlflow server 
             --backend-store-uri sqlite:///mlflow.db 
             --default-artifact-root /mlflow/artifacts 
             --host 0.0.0.0 
             --port 5000"
    volumes:
      - ../mlflow.db:/mlflow.db
      - ../mlruns:/mlflow/artifacts
    networks:
      - mlops-network

  # Prometheus (monitoring)
  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
    networks:
      - mlops-network

  # Alertmanager routes every alert to an internal audit sink. Set
  # ALERTMANAGER_CONFIG_FILE to the external template after provisioning its
  # secret files to fan out the same alert to Slack, email, and a webhook.
  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: alertmanager
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ${ALERTMANAGER_CONFIG_FILE:-../monitoring/alertmanager/alertmanager.yml}:/etc/alertmanager/alertmanager.yml:ro
      - ../monitoring/alertmanager/secrets:/run/secrets:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9093/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      notification-sink:
        condition: service_healthy
    networks:
      - mlops-network

  # Repository-local receiver representing an internal incident/audit system.
  # It is network-internal and persists received Alertmanager payloads as JSONL.
  notification-sink:
    image: python:3.9-slim
    container_name: churn-notification-sink
    command: ["python", "/app/notification_sink.py"]
    environment:
      - NOTIFICATION_LOG_PATH=/data/notifications.jsonl
      - NOTIFICATION_PORT=8080
    volumes:
      - ../monitoring/notification_sink.py:/app/notification_sink.py:ro
      - notification-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - mlops-network

  # Grafana (visualization)
  grafana:
    image: grafana/grafana:12.3.9
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-change-me-local}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_PLUGINS_PREINSTALL_DISABLED=true
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - mlops-network

networks:
  mlops-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  notification-data:
